services:
  fastapi-backend:
    build: .
    command: python -m uvicorn campusai.api.app:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      PYTHON_DOTENV_DISABLED: "1"
      GROQ_API_KEY: ${CAMPUSAI_DOCKER_GROQ_API_KEY:-}
      GROQ_MODEL: llama-3.3-70b-versatile
      GROQ_BASE_URL: https://api.groq.com/openai/v1
      RAW_DATA_DIR: data/raw
      VECTOR_STORE_PATH: data/vector_db
      CHROMA_COLLECTION: campusai_documents
    volumes:
      - ./data/raw:/app/data/raw
      - campusai_vector_db:/app/data/vector_db

  streamlit-ui:
    build: .
    command: streamlit run streamlit_app.py --server.address=0.0.0.0 --server.port=8501
    ports:
      - "8501:8501"
    depends_on:
      - fastapi-backend
    environment:
      PYTHON_DOTENV_DISABLED: "1"
      CAMPUSAI_API_BASE_URL: http://fastapi-backend:8000
      GROQ_API_KEY: ${CAMPUSAI_DOCKER_GROQ_API_KEY:-}
      GROQ_MODEL: llama-3.3-70b-versatile
      GROQ_BASE_URL: https://api.groq.com/openai/v1
      RAW_DATA_DIR: data/raw
      VECTOR_STORE_PATH: data/vector_db
      CHROMA_COLLECTION: campusai_documents
    volumes:
      - ./data/raw:/app/data/raw
      - campusai_vector_db:/app/data/vector_db

volumes:
  campusai_vector_db:
